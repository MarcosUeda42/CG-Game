<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <title>Jogo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #title-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(24, 16, 16, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Arial, sans-serif;
        z-index: 10;
      }
      #title-screen h1 {
        font-size: 3.5rem;
        margin-bottom: 20px;
      }
      #start-button {
        padding: 15px 30px;
        font-size: 1.5rem;
        background-color: #4c87af;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      #start-button:hover {
        background-color: #4562a0;
        transform: scale(1.05);
      }
      #pause-menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(24, 16, 16, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Arial, sans-serif;
        z-index: 20;
      }
      .pause-content {
        background: #181010;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        border: 1px solid #333;
      }
      .pause-content h2 {
        margin-top: 0;
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      #resume-button, #quit-button {
        width: 220px;   
        padding: 12px 0;    
        font-size: 1.1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        display: block;
        margin: 10px auto;   
        text-align: center;
      }

      #resume-button, #quit-button {
        background-color: #4c87af;
        color: white;
      }
      #resume-button:hover, #quit-button:hover {
        background-color: #4562a0;
        transform: scale(1.05);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Tela de Título -->
    <div id="title-screen">
      <h1>Título</h1>
      <button id="start-button">Jogar</button>
    </div>
    <!-- Menu de Pausa -->
    <div id="pause-menu" class="hidden">
      <div class="pause-content">
        <h2>Jogo Pausado</h2>
        <button id="resume-button">Continuar</button>
        <button id="quit-button">Voltar ao Título</button>
      </div>
    </div>
    <div id="health-bar" class="hidden"><div id="health-fill"></div></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="main.js" defer></script>
  </body>
</html>
